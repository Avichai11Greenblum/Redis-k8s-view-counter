name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # These give the job a real Redis and Postgres to talk to — the same
    # services docker-compose provides locally. Our tests are integration
    # tests against the real thing on purpose (see tests/conftest.py).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: views
          POSTGRES_PASSWORD: views
          POSTGRES_DB: views
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U views"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://views:views@localhost:5432/views

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run pytest
        run: uv run pytest tests/ -v
