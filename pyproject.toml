[project]
name = "redis-k8s-view-counter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avichai", email = "@" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.6",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
redis-k8s-view-counter = "redis_k8s_view_counter:main"
view-counter-worker = "redis_k8s_view_counter.drain_worker:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
