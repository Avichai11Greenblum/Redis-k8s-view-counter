# Dev-only credentials, plain text here on purpose (stringData — Kubernetes
# base64-encodes it for you). Base64 is encoding, not encryption; this file
# would need a real secret manager before this ever went anywhere but a
# local learning cluster.
apiVersion: v1
kind: Secret
metadata:
  name: view-counter-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "views"
  # Must stay in sync with POSTGRES_USER/POSTGRES_DB in configmap.yaml and
  # the password above — plain manifests have no templating to keep these
  # in sync automatically (that's what Helm/Kustomize solve, out of scope here).
  DATABASE_URL: "postgresql://views:views@postgres:5432/views"
